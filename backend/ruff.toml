target-version = "py311"

[lint]
# Ruff's defaults (syntax errors, undefined names, unused imports/variables), pinned
# so results don't depend on a user-level ruff config
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Env vars must be set before the app is imported
"tests/conftest.py" = ["E402"]
